<script>
async function startConversion() {
    let network = document.getElementById("network").value;
    let amount = document.getElementById("amount").value;
    let phone = document.getElementById("phone").value;

    if (!network || !amount || !phone) {
        alert("Please fill all the fields.");
        return;
    }

    if (amount < 500) {
        alert("Minimum amount is 500 Naira");
        return;
    }

    // Show loading message
    alert("Sending request... Please wait.");

    try {
        const response = await fetch("/.netlify/functions/convert", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                network: network,
                amount: amount,
                phone: phone
            })
        });

        const result = await response.json();

        if (result.success) {
            alert("Success!\n\nNetwork: " + result.received.network + 
                  "\nAmount: " + result.received.amount + 
                  "\nPhone: " + result.received.phone + 
                  "\n\n" + result.note);
        } else {
            alert("Error: " + (result.error || "Something went wrong"));
        }

    } catch (error) {
        alert("Failed to connect to the server. Please try again.");
    }
}
</script>
